<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buffalo Counter — The Last Herd</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #080808;
    --bg-surface: #111111;
    --bg-card: #161616;
    --border: rgba(196,154,58,0.10);
    --border-accent: rgba(196,154,58,0.35);
    --border-glow: rgba(196,154,58,0.6);
    --text: #e0e0e0;
    --text-secondary: #999;
    --text-muted: #555;
    --text-dim: #3a3a3a;
    --accent: #c49a3a;
    --accent-soft: rgba(196,154,58,0.08);
    --accent-glow: rgba(196,154,58,0.25);
    --danger: #c41e3a;
    --danger-soft: rgba(196,30,58,0.15);
    --success: #2d6a4f;
    --warning: #e76f51;
    --font-h: 'Space Grotesk', sans-serif;
    --font-b: 'Crimson Text', Georgia, serif;
    --card-radius: clamp(10px, 1.5vw, 18px);

    /* Fluid type scale — grows with viewport */
    --fs-xs: clamp(0.55rem, 0.8vw, 0.75rem);
    --fs-sm: clamp(0.7rem, 1vw, 0.9rem);
    --fs-base: clamp(0.9rem, 1.4vw, 1.15rem);
    --fs-md: clamp(1rem, 1.6vw, 1.3rem);
    --fs-lg: clamp(1.3rem, 2.2vw, 1.8rem);
    --fs-xl: clamp(1.8rem, 3.5vw, 2.8rem);
    --fs-2xl: clamp(2.4rem, 5vw, 4rem);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-b);
    font-size: var(--fs-base);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
}

/* ═══ FIXED COUNTER ═══ */
.counter-fixed {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: clamp(8px, 1.5vh, 16px) clamp(12px, 2vw, 24px) clamp(6px, 1vh, 14px);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
}
.counter-fixed.compact {
    padding: 6px 16px 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
.counter-fixed.compact .counter-label,
.counter-fixed.compact .status-row { opacity:0; height:0; margin:0; overflow:hidden; }
.counter-fixed.compact .counter-value { font-size: var(--fs-xl); }
.counter-fixed.compact .year-display { font-size: var(--fs-sm); }
.counter-fixed.compact h1 { font-size: var(--fs-xs); }

h1 {
    font-family: var(--font-h);
    font-size: var(--fs-xs); font-weight: 700;
    letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: clamp(2px, 0.5vh, 6px);
    transition: font-size 0.4s;
}
.year-display {
    font-family: var(--font-h);
    font-size: var(--fs-md); font-weight: 600;
    color: var(--accent); margin-bottom: clamp(1px, 0.3vh, 4px);
    transition: font-size 0.4s;
}
.counter-value {
    font-family: var(--font-h);
    font-size: var(--fs-2xl);
    font-weight: 700; color: var(--danger);
    line-height: 1; letter-spacing: -0.02em;
    text-shadow: 0 0 50px rgba(196,30,58,0.2);
    transition: font-size 0.4s, color 0.6s;
}
.counter-value.warning { color: var(--warning); }
.counter-value.danger { color: var(--danger); }
.counter-label {
    font-size: var(--fs-sm); color: var(--text-secondary);
    font-style: italic; margin-top: clamp(2px, 0.5vh, 6px);
    transition: all 0.4s;
}
.status-row {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-h); font-size: var(--fs-xs); font-weight: 500;
    color: var(--text-secondary); margin-top: clamp(2px, 0.4vh, 6px);
    transition: all 0.4s;
}
.status-dot {
    width: clamp(5px, 0.8vw, 8px); height: clamp(5px, 0.8vw, 8px);
    border-radius: 50%;
    background: var(--success); flex-shrink: 0;
    transition: background 0.6s;
}
.status-dot.warning { background: var(--warning); }
.status-dot.danger { background: var(--danger); }

/* ── Timeline ── */
.tl-wrap {
    width: 100%; max-width: clamp(300px, 40vw, 560px);
    margin-top: clamp(4px, 0.8vh, 10px);
}
.tl-bar {
    position: relative; height: clamp(4px, 0.6vw, 7px);
    background: var(--bg-surface);
    border-radius: 999px; overflow: visible;
}
.tl-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--danger));
    border-radius: 999px;
    transition: width 0.1s linear;
}
.tl-dots { position: absolute; inset: 0; }
.tl-dot {
    position: absolute; top: 50%;
    transform: translate(-50%, -50%);
    width: clamp(10px, 1.2vw, 16px); height: clamp(10px, 1.2vw, 16px);
    background: var(--bg-surface);
    border: 2px solid var(--text-muted);
    border-radius: 50%; z-index: 2;
    transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
}
.tl-dot.passed {
    background: var(--accent);
    border-color: var(--accent);
}
.tl-dot.active {
    background: var(--danger);
    border-color: var(--danger);
    box-shadow: 0 0 0 clamp(3px, 0.4vw, 6px) var(--danger-soft), 0 0 20px rgba(196,30,58,0.3);
    transform: translate(-50%, -50%) scale(1.4);
}
.tl-labels {
    display: flex; justify-content: space-between;
    font-family: var(--font-h); font-size: var(--fs-xs); font-weight: 500;
    color: var(--text-muted); margin-top: clamp(3px, 0.4vh, 8px); padding: 0 4px;
}

/* ── Controls ── */
.controls { display: flex; gap: clamp(6px, 1vw, 12px); margin-top: clamp(6px, 1vh, 14px); }
.btn {
    font-family: var(--font-h); font-size: var(--fs-xs); font-weight: 600;
    padding: clamp(5px, 0.8vh, 9px) clamp(12px, 1.5vw, 22px);
    background: transparent; border: 1.5px solid var(--accent);
    color: var(--accent); border-radius: 8px;
    cursor: pointer; text-transform: uppercase;
    letter-spacing: 0.12em; transition: all 0.2s;
}
.btn:hover { background: var(--accent-soft); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-primary:hover { background: #d4a843; }

/* ═══ EVENTS AREA ═══ */
.events-area {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    padding: clamp(12px, 2vh, 28px) clamp(10px, 1.5vw, 28px) clamp(44px, 5vh, 60px);
    display: flex;
    flex-direction: column;
}

/* ── Event cards grid ── */
.events-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, clamp(260px, 26vw, 380px)), 1fr));
    grid-auto-rows: 1fr;
    gap: clamp(8px, 1.2vw, 18px);
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    min-height: 0;
}

/* ── Event cards ── */
.event-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    overflow: hidden;
    opacity: 0.35;
    filter: grayscale(0.7);
    transform: scale(0.97);
    transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1),
                filter 0.8s cubic-bezier(0.4,0,0.2,1),
                transform 0.8s cubic-bezier(0.4,0,0.2,1),
                box-shadow 0.6s cubic-bezier(0.4,0,0.2,1),
                border-color 0.6s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.event-card.active {
    opacity: 1;
    filter: grayscale(0);
    transform: scale(1);
    border-color: var(--border-accent);
    box-shadow: 0 clamp(4px, 0.5vw, 12px) clamp(20px, 3vw, 50px) rgba(0,0,0,0.4),
                0 2px 8px rgba(0,0,0,0.3),
                0 0 0 1px var(--border-accent),
                0 0 clamp(15px, 2vw, 40px) var(--accent-glow);
}
.event-card:hover {
    box-shadow: 0 clamp(4px, 0.5vw, 12px) clamp(20px, 3vw, 50px) rgba(0,0,0,0.4),
                0 2px 8px rgba(0,0,0,0.3), 0 0 0 1px var(--border-accent);
}

.event-card-img-wrap { position: relative; overflow: hidden; }
.event-card-img {
    width: 100%;
    height: clamp(80px, 12vh, 160px);
    object-fit: cover;
    display: block;
    background: var(--bg-surface);
    transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
}
.event-card:hover .event-card-img { transform: scale(1.03); }
.event-card-img-overlay {
    position: absolute; bottom: 0; left: 0; right: 0; height: 55%;
    background: linear-gradient(transparent, rgba(8,8,8,0.7));
    pointer-events: none;
}
.event-card-year-badge {
    position: absolute; top: clamp(8px, 1vw, 14px); left: clamp(8px, 1vw, 14px);
    font-family: var(--font-h); font-size: var(--fs-xs); font-weight: 700;
    color: var(--bg); background: var(--accent);
    padding: clamp(3px, 0.4vw, 5px) clamp(8px, 1vw, 14px);
    border-radius: 6px;
    letter-spacing: 0.05em;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    opacity: 0.5;
    transition: opacity 0.6s;
}
.event-card.active .event-card-year-badge { opacity: 1; }

.event-card-body { padding: clamp(10px, 1.5vw, 20px) clamp(12px, 1.5vw, 22px) clamp(12px, 1.5vw, 22px); }
.event-card-title {
    font-family: var(--font-h); font-size: var(--fs-md); font-weight: 700;
    margin-bottom: clamp(5px, 0.8vh, 10px); line-height: 1.3; letter-spacing: -0.01em;
    color: var(--text-dim);
    transition: color 0.6s;
}
.event-card.active .event-card-title { color: var(--text); }
.event-card-desc {
    font-size: var(--fs-base); color: var(--text-dim);
    line-height: 1.7; margin-bottom: clamp(8px, 1vh, 14px);
    transition: color 0.6s;
}
.event-card.active .event-card-desc { color: var(--text-secondary); }
.event-card-source {
    font-family: var(--font-h); font-size: var(--fs-xs); font-weight: 500;
    color: var(--text-dim); font-style: italic;
    padding-top: clamp(6px, 0.8vh, 12px); border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
    transition: color 0.6s;
}
.event-card.active .event-card-source { color: var(--text-muted); }
.event-card-source::before { content: '📖'; font-style: normal; font-size: var(--fs-sm); }

/* ── Flag icon for Canadian events ── */
.event-card-flag {
    display: inline-block;
    font-size: var(--fs-sm);
    margin-left: 6px;
    opacity: 0;
    transition: opacity 0.6s;
}
.event-card.active .event-card-flag { opacity: 0.7; }

/* ── Intro card ── */
.event-card-intro {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(196,154,58,0.04), rgba(196,154,58,0.01));
}
.event-card-intro .event-card-title {
    font-size: var(--fs-lg);
}

/* ── Sources tab ── */
.sources-tab {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
    background: var(--bg-surface); border-top: 1px solid var(--border);
    padding: clamp(6px, 0.8vh, 12px) clamp(12px, 2vw, 24px);
    font-family: var(--font-h);
    font-size: var(--fs-xs); font-weight: 500; color: var(--text-muted);
    text-align: center; letter-spacing: 0.05em;
}

@media (min-width: 768px) {
    .events-grid {
        grid-template-columns: repeat(auto-fill, minmax(clamp(300px, 30vw, 440px), 1fr));
    }
}
</style>
</head>
<body>

<div class="counter-fixed" id="counterFixed">
    <h1>The Buffalo Counter</h1>
    <div class="year-display" id="yearDisplay">Year 1800</div>
    <div class="counter-value" id="counterValue">30,000,000</div>
    <div class="counter-label" id="counterLabel">Plains Buffalo</div>
    <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Population stable</span>
    </div>
    <div class="tl-wrap">
        <div class="tl-bar">
            <div class="tl-fill" id="tlFill"></div>
            <div class="tl-dots" id="tlDots"></div>
        </div>
        <div class="tl-labels"><span>1800</span><span>1850</span><span>1900</span></div>
    </div>
    <div class="controls">
        <button class="btn btn-primary" id="playBtn">▶ Play</button>
        <button class="btn" id="resetBtn">↺ Reset</button>
    </div>
</div>

<div class="events-area" id="eventsArea">
    <div class="events-grid" id="eventsGrid"></div>
</div>

<div class="sources-tab">Sources & References ▲</div>

<script>
const CONFIG = {
    startYear: 1800,
    endYear: 1900,
    startPop: 30000000,
    endPop: 500,
    cardInterval: 8000,
};

// ── 7 cards: intro + 6 events, all with images, Canadian-focused narrative ──
const EVENTS = [
    {
        year: 1800,
        title: 'A Vast Ocean of Buffalo',
        isIntro: true,
        desc: 'In 1800, somewhere between 24 and 30 million buffalo roamed the Great Plains. Their range stretched from present-day Alberta and Saskatchewan down through the prairies of Montana, the Dakotas, and deep into Texas. For the Métis, Blackfoot, Lakota, Cree, and dozens of other nations, the buffalo was not just food. It was shelter, clothing, tools, fuel, and spiritual life. The relationship between Indigenous peoples and the buffalo had sustained itself for thousands of years. That was about to change.',
        source: 'Isenberg, 2000; Smits, 1994',
        img: 'images/buffalo-trade-illustration.webp',
        imgAlt: 'Illustration of buffalo herds on the Great Plains',
        canadian: false,
    },
    {
        year: 1825,
        title: 'The Fur Trade Era',
        desc: 'The Hudson\'s Bay Company and North West Company relied on pemmican and buffalo robes to sustain their fur trade operations. Métis communities were drawn into this commercial system, organizing semi-annual buffalo brigades to provision traders through harsh winters. This trade caused some decline near posts. But the industrial slaughter that came later was orders of magnitude worse.',
        source: 'Ens, 1996; Colpitts, 2015',
        img: 'images/metis-brigades.jpg',
        imgAlt: 'Métis buffalo brigade on the prairie',
        canadian: true,
    },
    {
        year: 1870,
        title: 'The Great Collapse',
        desc: 'The population fell from 12 to 15 million to 5.5 million in just five years. American hide hunters, backed by the transcontinental railroad, poured onto the Plains. For every hide shipped east, several more buffalo were killed and left to rot. Skull piles stretched for miles across the prairies. The Métis, who had lived alongside the buffalo for generations, watched American industrial slaughter destroy what sustained their world.',
        source: 'Isenberg, 2000; Smits, 1994',
        img: 'images/bison-skull-pile.jpg',
        imgAlt: 'Massive pile of buffalo skulls on the prairie',
        canadian: false,
    },
    {
        year: 1874,
        title: 'US Army & the Hide Hunters',
        desc: 'The American military made it official policy. Generals Sherman and Sheridan championed the slaughter as a solution to the "Indian problem." Soldiers hunted buffalo for target practice. Sheridan told Congress: "Kill every buffalo you can. Every buffalo dead is an Indian gone." Between 1872 and 1874, close to 3 million buffalo were killed in Kansas alone. The same strategy played out across the northern Plains and into what is now western Canada.',
        source: 'Smits, 1994; Congressional Globe, 1874',
        img: 'images/bison-hides-dodge-city.jpg',
        imgAlt: 'Stacks of buffalo hides at the Dodge City rail depot',
        canadian: false,
    },
    {
        year: 1877,
        title: 'Canada\'s Numbered Treaties',
        desc: 'As the buffalo disappeared, the Canadian government moved to extinguish Indigenous title through the Numbered Treaties. Treaty 7 was signed in September 1877. Elders remember the last buffalo being seen shortly after. The government understood that starving Indigenous people were easier to control. The scrip system followed, replacing collective land rights with individual coupons that speculators exploited to take what land remained.',
        source: 'Price, 1999; Indigenous Peoples Atlas of Canada',
        img: 'https://placehold.co/600x220/1a1a1a/c49a3a?text=Treaty+7+%281877%29',
        canadian: true,
    },
    {
        year: 1883,
        title: 'The Bone Trade & Starvation',
        desc: 'Fewer than a thousand buffalo remained. The species was functionally extinct. But the exploitation wasn\'t finished. Buffalo bones were collected by the ton for fertilizer and sugar refining. Major collection points at Regina (nicknamed "Pile of Bones"), Moose Jaw, and Medicine Hat shipped hundreds of thousands of skeletons east on the CPR. In 1884, a quarter of the Blackfeet died of starvation over the winter.',
        source: 'MacEwan, 1995; Calloway, 1996',
        img: 'images/buffalo-bones-cpr-boxcar.jpg',
        imgAlt: 'CPR boxcar loaded with buffalo bones for shipment east',
        canadian: true,
    },
    {
        year: 1900,
        title: 'By 1900: Functionally Extinct',
        desc: 'By 1900, fewer than 500 buffalo remained in all of North America. Most were in captivity — zoos, private ranches, a handful of small wild herds in remote corners of Yellowstone and Alberta. The species that once numbered in the tens of millions, that had sustained entire civilizations across the Plains for millennia, was reduced to a few hundred scattered survivors. The Canadian government had used the collapse to push through the Numbered Treaties and the scrip system, dispossessing Métis and Indigenous peoples of their lands. The buffalo were gone. And with them went the foundation of Plains Indigenous life.',
        source: 'Isenberg, 2000; Loo, 2006; Daschuk, 2013',
        img: 'https://placehold.co/600x220/1a1a1a/c49a3a?text=Fewer+than+500+remain',
        canadian: true,
    },
];

// ── Schedule: deterministic time→year mapping ──
// 7 cards at 8s intervals = 56 seconds total
const SCHEDULE = [];
SCHEDULE.push({ year: CONFIG.startYear, time: 0 });
EVENTS.forEach((evt, i) => {
    SCHEDULE.push({ year: evt.year, time: i * CONFIG.cardInterval });
});
SCHEDULE.push({ year: CONFIG.endYear, time: EVENTS.length * CONFIG.cardInterval });
const TOTAL_DURATION = SCHEDULE[SCHEDULE.length - 1].time;

function getYearAtTime(elapsedMs) {
    const t = elapsedMs;
    for (let i = 0; i < SCHEDULE.length - 1; i++) {
        const curr = SCHEDULE[i];
        const next = SCHEDULE[i + 1];
        if (t >= curr.time && t <= next.time) {
            const segT = (t - curr.time) / (next.time - curr.time);
            return curr.year + (next.year - curr.year) * segT;
        }
    }
    return CONFIG.endYear;
}

// ── Population model: sourced from "Buffalo data" Google Doc (Drive ID: 1L3CSOEdX95jIX2giL5ro7VrrMBEAETJlUmi_LYAM6Bo) ──
// Table: "Buffalo Population | Year" with citations from Isenberg 2000, Lott, PBS Ken Burns, Roe 1951, Hornaday 1888
function getPopulation(year) {
    const dataPoints = [
        { y: 1800, p: 30000000 },   // 24-30M (Isenberg 2000)
        { y: 1850, p: 20000000 },   // 20M (Lott)
        { y: 1865, p: 13500000 },   // 12-15M midpoint (PBS Ken Burns)
        { y: 1870, p: 5500000 },    // 5.5M (Lott)
        { y: 1880, p: 395000 },     // 395,000 (Roe 1951)
        { y: 1889, p: 653 },        // 653 (Hornaday 1888)
        { y: 1900, p: 500 },        // ~500 (extrapolated: captive + wild survivors)
    ];
    for (let i = 0; i < dataPoints.length - 1; i++) {
        if (year >= dataPoints[i].y && year <= dataPoints[i + 1].y) {
            const t = (year - dataPoints[i].y) / (dataPoints[i + 1].y - dataPoints[i].y);
            const logP = Math.log(dataPoints[i].p) + t * (Math.log(dataPoints[i + 1].p) - Math.log(dataPoints[i].p));
            return Math.max(CONFIG.endPop, Math.round(Math.exp(logP)));
        }
    }
    if (year <= dataPoints[0].y) return dataPoints[0].p;
    return dataPoints[dataPoints.length - 1].p;
}

function formatNumber(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + ',000,000';
    if (n >= 1000) return (n / 1000).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ',000';
    return n.toLocaleString();
}

// ── State ──
let isPlaying = false;
let startTimestamp = 0;
let pausedElapsed = 0;
let rafId = null;
let activeEvents = new Set();

// ── DOM ──
const counterFixed = document.getElementById('counterFixed');
const yearDisplay = document.getElementById('yearDisplay');
const counterValue = document.getElementById('counterValue');
const counterLabel = document.getElementById('counterLabel');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const tlFill = document.getElementById('tlFill');
const tlDots = document.getElementById('tlDots');
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const eventsArea = document.getElementById('eventsArea');
const eventsGrid = document.getElementById('eventsGrid');

// ── Set padding-top on events area to clear the fixed counter ──
function updateEventsAreaOffset() {
    const h = counterFixed.offsetHeight;
    eventsArea.style.paddingTop = (h + 12) + 'px';
}
updateEventsAreaOffset();
window.addEventListener('resize', updateEventsAreaOffset);

// ── Build timeline dots ──
EVENTS.forEach(evt => {
    const pct = ((evt.year - CONFIG.startYear) / (CONFIG.endYear - CONFIG.startYear)) * 100;
    const dot = document.createElement('div');
    dot.className = 'tl-dot';
    dot.style.left = pct + '%';
    dot.dataset.year = evt.year;
    dot.title = evt.year + ': ' + evt.title;
    tlDots.appendChild(dot);
});
const dotEls = () => document.querySelectorAll('.tl-dot');

// ── Build all cards upfront (dimmed/inactive) ──
const cardEls = [];
EVENTS.forEach((evt, i) => {
    const card = document.createElement('div');
    const isIntro = evt.isIntro;
    card.className = 'event-card' + (isIntro ? ' event-card-intro' : '');
    card.dataset.index = i;

    const flagHtml = evt.canadian ? '<span class="event-card-flag">🇨🇦</span>' : '';

    const imgHtml = `<div class="event-card-img-wrap">
        <img class="event-card-img" src="${evt.img}" alt="${evt.imgAlt || evt.title}" loading="lazy">
        <div class="event-card-img-overlay"></div>
        <span class="event-card-year-badge">${evt.year}</span>
    </div>`;

    card.innerHTML = `
        ${imgHtml}
        <div class="event-card-body">
            <div class="event-card-title">${evt.title}${flagHtml}</div>
            <p class="event-card-desc">${evt.desc}</p>
            <div class="event-card-source">${evt.source}</div>
        </div>
    `;

    eventsGrid.appendChild(card);
    cardEls.push(card);
});

// ── Main animation loop ──
function animate() {
    const elapsed = performance.now() - startTimestamp + pausedElapsed;

    if (elapsed >= TOTAL_DURATION) {
        updateDisplay(CONFIG.endYear, 1);
        EVENTS.forEach((_, i) => { if (!activeEvents.has(i)) activateEvent(i); });
        pause();
        return;
    }

    const year = getYearAtTime(elapsed);
    const progress = (year - CONFIG.startYear) / (CONFIG.endYear - CONFIG.startYear);
    updateDisplay(year, progress);

    EVENTS.forEach((_, i) => {
        const cardTime = i * CONFIG.cardInterval;
        if (elapsed >= cardTime && !activeEvents.has(i)) {
            activateEvent(i);
        }
    });

    rafId = requestAnimationFrame(animate);
}

function updateDisplay(year, progress) {
    const pop = getPopulation(year);
    const t = progress;

    yearDisplay.textContent = 'Year ' + Math.round(year);
    counterValue.textContent = formatNumber(pop);

    counterValue.classList.remove('warning', 'danger');
    statusDot.classList.remove('warning', 'danger');
    if (t > 0.6) {
        counterValue.classList.add('danger');
        statusDot.classList.add('danger');
        statusText.textContent = 'Critical decline';
    } else if (t > 0.35) {
        counterValue.classList.add('warning');
        statusDot.classList.add('warning');
        statusText.textContent = 'Population declining';
    } else {
        statusText.textContent = 'Population stable';
    }

    tlFill.style.width = (t * 100) + '%';

    const currentRounded = Math.round(year);
    dotEls().forEach(dot => {
        const dy = parseInt(dot.dataset.year);
        dot.classList.remove('passed', 'active');
        if (dy < currentRounded) dot.classList.add('passed');
        if (dy === currentRounded) dot.classList.add('active');
    });
}

function activateEvent(index) {
    if (activeEvents.has(index)) return;
    activeEvents.add(index);
    const card = cardEls[index];
    if (card) {
        card.classList.add('active');
    }
}

function play() {
    if (isPlaying) return;
    isPlaying = true;
    playBtn.textContent = '❚❚ Pause';
    startTimestamp = performance.now();
    activateEvent(0);
    rafId = requestAnimationFrame(animate);
}

function pause() {
    isPlaying = false;
    playBtn.textContent = '▶ Play';
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    pausedElapsed += performance.now() - startTimestamp;
}

function togglePlay() {
    if (pausedElapsed >= TOTAL_DURATION) { reset(); play(); }
    else if (isPlaying) pause();
    else play();
}

function reset() {
    pause();
    pausedElapsed = 0;
    startTimestamp = 0;
    activeEvents.clear();
    cardEls.forEach(card => card.classList.remove('active'));
    updateDisplay(CONFIG.startYear, 0);
}

playBtn.addEventListener('click', togglePlay);
resetBtn.addEventListener('click', reset);
document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'KeyR') reset();
});

updateDisplay(CONFIG.startYear, 0);
</script>
</body>
